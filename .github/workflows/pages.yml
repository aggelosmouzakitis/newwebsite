# Deploy the SOMO site to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Publishes at https://<owner>.github.io/<repo>/ .
# Add a CNAME file with a custom domain to publish at that domain's root instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Custom domain (CNAME present) -> served at root, no base path.
      # Otherwise a project site -> served under /<repo>/.
      - name: Resolve deployment paths
        id: cfg
        run: |
          if [ -f CNAME ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "site=https://$(tr -d '[:space:]' < CNAME)" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          BASE_PATH: ${{ steps.cfg.outputs.base }}
          SITE_URL: ${{ steps.cfg.outputs.site }}
        run: node src/build.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
